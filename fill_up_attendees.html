<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding RSVP - Will you be attending?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-shadow: none;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') center center;
            background-size: cover;
            background-position: center;
        }

        .background-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        .rsvp-form {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 18px;
            width: 600px;
            box-shadow: 0 12px 20px rgba(0, 0, 7, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .form-title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            font-family: 'Playfair Display', serif;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid #e0e0e0;
            background: transparent;
            font-size: 14px;
            color: #333;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-bottom-color: #22c55e;
        }

        .form-input::placeholder {
            color: #999;
        }

        .type-selection {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .type-option {
            flex: 1;
            text-align: center;
            padding: 12px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .type-option:hover {
            border-color: #22c55e;
            color: #22c55e;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.2);
        }

        .type-option.selected {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-color: #22c55e;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .decorative-elements {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                width: 100vw;
            }
            
            .rsvp-form {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                width: 100%;
                max-width: 600px;
                margin: 40px auto;
            }
        }

        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 20%; animation-delay: 2s; }
        .heart:nth-child(3) { left: 30%; animation-delay: 4s; }
        .heart:nth-child(4) { left: 40%; animation-delay: 1s; }
        .heart:nth-child(5) { left: 50%; animation-delay: 3s; }
        .heart:nth-child(6) { left: 60%; animation-delay: 5s; }
        .heart:nth-child(7) { left: 70%; animation-delay: 2s; }
        .heart:nth-child(8) { left: 80%; animation-delay: 4s; }
        .heart:nth-child(9) { left: 90%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-image"></div>
        
        <div class="floating-hearts">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>

        <div class="rsvp-form">
            <h2 class="form-title">Will you be attending the wedding?</h2>
            
            <form id="rsvpForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" placeholder="Enter your full name" required>
                </div>
                
                
                
                <div class="form-group">
                    <label class="form-label">Guest Type</label>
                    <div class="type-selection">
                        <div class="type-option" data-type="guest">Guest</div>
                        <div class="type-option" data-type="vip">VIP</div>
                        <div class="type-option" data-type="flower_girl">Flower Girl</div>
                        <div class="type-option" data-type="bridesmaid">Bridesmaid</div>
                        <div class="type-option" data-type="groomsman">Groomsman</div>
                        <div class="type-option" data-type="maid_of_honor">Maid of Honor</div>
                        <div class="type-option" data-type="best_man">Best Man</div>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>

        <div class="decorative-elements">
            <div class="wedding-icon">💒</div>
            <div class="wedding-text">
                Join us for our<br>
                special day
            </div>
        </div>
    </div>

    <script>
        // Type selection functionality
        document.querySelectorAll('.type-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.type-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        const CATEGORIES = [
            { key: 'guests', title: 'Guests', type: 'guest' },
            { key: 'vips', title: "VIP'S", type: 'vip' },
            { key: 'flower_girls', title: 'Flower Girls', type: 'flower_girl' },
            { key: 'bridesmaids', title: 'Bridesmaids', type: 'bridesmaid' },
            { key: 'groomsmen', title: 'Groomsmen', type: 'groomsman' },
            { key: 'maid_of_honor', title: 'Maid of Honor', type: 'maid_of_honor' },
            { key: 'best_man', title: 'Best Man', type: 'best_man' }
        ];

        function mapTypeToKey(type) {
            const found = CATEGORIES.find(c => c.type === type);
            return found ? found.key : 'guests';
        }

        // Form submission
        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = this.querySelector('input[type="email"]').value;
            const name = this.querySelector('input[type="text"]').value;
            const type = document.querySelector('.type-option.selected')?.dataset.type || 'guest';
            
            console.log('Form data being sent:', { name, email, type }); // Debug log
            console.log('Selected type element:', document.querySelector('.type-option.selected'));
            
            if (!name || !email) {
                alert('Please fill in all fields');
                return;
            }
            
            try {
                // First check if this email already has attendees
                const emailKey = `attendees_${email.replace(/[^a-zA-Z0-9]/g, '')}`;
                let hasExistingAttendees = false;
                
                // Check all categories for existing attendees with this email
                const categories = ['guests', 'vips', 'flower_girls', 'bridesmaids', 'groomsmen', 'maid_of_honor', 'best_man'];
                for (const cat of categories) {
                    const existing = JSON.parse(localStorage.getItem(`${emailKey}_${cat}`) || '[]');
                    if (existing.length > 0) {
                        hasExistingAttendees = true;
                        break;
                    }
                }
                
                // If email already exists, just add to existing list
                if (hasExistingAttendees) {
                    const attendee = { name: name, email: email };
                    const key = mapTypeToKey(type);
                    const existingAttendees = JSON.parse(localStorage.getItem(`${emailKey}_${key}`) || '[]');
                    existingAttendees.push(attendee);
                    localStorage.setItem(`${emailKey}_${key}`, JSON.stringify(existingAttendees));
                    
                    // Store the email for the list page to detect
                    localStorage.setItem('user_email', email);
                    // Store original email for display purposes
                    localStorage.setItem(`original_email_${email.replace(/[^a-zA-Z0-9]/g, '')}`, email);
                    
                    const message = `Thank you ${name}! You've been added to the existing ${email} guest list as a ${type.toUpperCase()} guest.`;
                    alert(message);
                    return;
                }
                
                // If email doesn't exist, create new entry on server
                const response = await fetch('http://localhost:5000/Fill_up_attendees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        type: type
                    })
                });
                
                if (response.ok) {
                    console.log('Successfully saved to server');
                    
                    // Save to email-specific localStorage
                    const attendee = { name: name, email: email };
                    const key = mapTypeToKey(type);
                    const existingAttendees = JSON.parse(localStorage.getItem(`${emailKey}_${key}`) || '[]');
                    existingAttendees.push(attendee);
                    localStorage.setItem(`${emailKey}_${key}`, JSON.stringify(existingAttendees));
                    
                    // Store the email for the list page to detect
                    localStorage.setItem('user_email', email);
                    // Store original email for display purposes
                    localStorage.setItem(`original_email_${email.replace(/[^a-zA-Z0-9]/g, '')}`, email);
                    
                    const message = `Thank you ${name}! Your RSVP has been submitted as a ${type.toUpperCase()} guest.`;
                    alert(message);
                    
                    // Reset form
                    this.reset();
                    document.querySelectorAll('.type-option').forEach(opt => opt.classList.remove('selected'));
                } else {
                    const result = await response.json();
                    alert(`Server Error: ${result.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                
                // Fallback to localStorage only if server is unavailable
                try {
                    const attendee = { name: name, email: email };
                    const key = mapTypeToKey(type);
                    const emailKey = `attendees_${email.replace(/[^a-zA-Z0-9]/g, '')}`;
                    const existingAttendees = JSON.parse(localStorage.getItem(`${emailKey}_${key}`) || '[]');
                    existingAttendees.push(attendee);
                    localStorage.setItem(`${emailKey}_${key}`, JSON.stringify(existingAttendees));
                    
                    // Store the email for the list page to detect
                    localStorage.setItem('user_email', email);
                    // Store original email for display purposes
                    localStorage.setItem(`original_email_${email.replace(/[^a-zA-Z0-9]/g, '')}`, email);
                    
                    // Check if this email already has attendees
                    const hasExistingAttendees = existingAttendees.length > 1;
                    const message = hasExistingAttendees 
                        ? `Thank you ${name}! You've been added to the existing ${email} guest list as a ${type.toUpperCase()} guest. (Saved locally)`
                        : `Thank you ${name}! Your RSVP has been submitted as a ${type.toUpperCase()} guest. (Saved locally)`;
                    
                    alert(message);
                    
                    this.reset();
                    document.querySelectorAll('.type-option').forEach(opt => opt.classList.remove('selected'));
                } catch (localError) {
                    alert('Failed to submit RSVP. Please try again.');
                }
            }
        });

        // Add some interactive effects
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
