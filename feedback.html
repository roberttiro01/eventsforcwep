<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body>
    <!-- Feedback Hero -->
    <div class="feedback-hero">
        <div class="hero-inner">
            <h1 class="hero-title">Share your <span class="script-text">Event Feedback</span></h1>
            <p class="hero-subtitle">After your event is completed, let us know what went well and what we can improve.</p>
        </div>
    </div>

    <!-- Feedback Form Section -->
    <div class="contact-form-section">
        <div class="container">
            
            
            <div class="contact-form-container">
                <form class="contact-form" id="messageForm">

                    <div class="form-group photo-group">
                        <label for="photo" class="form-label">Add Photo</label>
                        <div class="photo-upload-area" id="photoUploadArea">
                            <div class="upload-icon">📷</div>
                            <p class="upload-text">Click to upload or drag and drop</p>
                            <p class="upload-hint">PNG, JPG, GIF up to 10MB</p>
                            <input type="file" id="photo" name="photo" accept="image/*" class="photo-input" />
                        </div>
                        <div class="photo-preview" id="photoPreview" style="display: none;">
                            <img id="previewImage" src="" alt="Preview" />
                            <button type="button" class="remove-photo" id="removePhoto">×</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" id="name" name="name" class="form-input" placeholder="Your full name" required />
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="email" class="form-label">Email (optional)</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">Description *</label>
                        <textarea id="description" name="description" class="form-textarea" placeholder="Tell us what happened, what you liked, or what we can improve..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Rate Your Experience (optional)</label>
                        <div class="star-rating-container">
                            <div class="star-rating" id="starRating">
                                <span class="star" data-rating="1">★</span>
                                <span class="star" data-rating="2">★</span>
                                <span class="star" data-rating="3">★</span>
                                <span class="star" data-rating="4">★</span>
                                <span class="star" data-rating="5">★</span>
                            </div>
                            <div class="rating-text" id="ratingText">Click to rate</div>
                            <input type="hidden" id="rating" name="rating" value="0">
                        </div>
                    </div>

                    

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Send feedback</button>
                        <button type="reset" class="reset-btn">Clear form</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal" style="display: none;">
        <div class="modal-content">
            <h3>Feedback sent</h3>
            <p>Thank you for your feedback! We appreciate your time.</p>
            <button type="button" class="ok-btn" id="successOkBtn">Okay</button>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }

        /* Feedback Hero */
        .feedback-hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #334155 100%);
            color: #fff;
            padding: 60px 0;
            text-align: center;
        }

        .feedback-hero .hero-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
        }

        .feedback-hero .hero-subtitle {
            font-size: 18px;
            opacity: 0.95;
            max-width: 750px;
            margin: 0 auto;
        }

        .script-text {
            font-style: italic;
            color: #d4af37;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Contact Form Section */
        .contact-form-section {
            padding: 50px 0;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .form-subtitle {
            font-size: 16px;
            color: #666;
            max-width: 500px;
            margin: 0 auto;
        }

        .contact-form-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            backdrop-filter: blur(4px);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .form-input, .form-textarea {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* Narrower full name field */
        #name {
            max-width: 420px;
            width: 100%;
        }
        /* Match email width to name for alignment */
        #email {
            max-width: 420px;
            width: 100%;
        }

        

        

        

        /* Photo Upload Styles */
        .photo-group {
            margin-bottom: 12px;
        }

        .photo-upload-area {
            border: 2px dashed #d4af37;
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            background: #fefefe;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            max-width: 420px; /* reduce width */
            margin: 0 auto;   /* center it */
        }

        .photo-upload-area:hover {
            border-color: #b89728;
            background: #f9f9f9;
        }

        .photo-upload-area.dragover {
            border-color: #d4af37;
            background: #fff8e1;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .upload-hint {
            font-size: 13px;
            color: #666;
        }

        .photo-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            pointer-events: none;
        }

        .photo-preview {
            position: relative;
            display: inline-block;
            margin-top: 15px;
        }

        .photo-preview img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .remove-photo {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-photo:hover {
            background: #c82333;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .submit-btn, .reset-btn {
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #b89728 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .reset-btn {
            background: transparent;
            color: #666;
            border: 2px solid #e9ecef;
        }

        .reset-btn:hover {
            background: #f8f9fa;
            border-color: #d4af37;
            color: #d4af37;
        }

        /* Spinner inside submit button */
        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.35);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            vertical-align: -3px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Star Rating Styles */
        .star-rating-container {
            text-align: center;
            margin: 15px 0;
        }

        .star-rating {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .star {
            font-size: 32px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .star:hover,
        .star.active {
            color: #ffd700;
            transform: scale(1.1);
        }

        .star:hover ~ .star {
            color: #e0e0e0;
        }

        .rating-text {
            font-size: 14px;
            color: #666;
            font-style: italic;
            min-height: 20px;
        }

        /* Toast */
        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #1e3a8a;
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: all 0.25s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.18);
        }
        .modal-content h3 {
            margin-bottom: 8px;
            color: #1f2937;
        }
        .modal-content p {
            color: #4b5563;
            margin-bottom: 16px;
        }
        .ok-btn {
            background: linear-gradient(135deg, #1e3a8a 0%, #334155 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
        }
        .ok-btn:hover {
            filter: brightness(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contact-form-container {
                padding: 15px;
                margin: 0 10px;
            }
            .form-row-2 { grid-template-columns: 1fr; }
            .form-title {
                font-size: 24px;
            }
            .form-subtitle {
                font-size: 14px;
            }
            .form-actions {
                flex-direction: column;
                align-items: center;
            }
            .submit-btn, .reset-btn {
                width: 100%;
                max-width: 300px;
            }
            .photo-upload-area {
                padding: 25px 12px;
            }
            .upload-icon {
                font-size: 32px;
            }
            .upload-text {
                font-size: 14px;
            }
            .star {
                font-size: 28px;
            }
            .rating-text {
                font-size: 13px;
            }
        }
    </style>

    <script>
        

        // Photo upload functionality
        const photoInput = document.getElementById('photo');
        const photoUploadArea = document.getElementById('photoUploadArea');
        const photoPreview = document.getElementById('photoPreview');
        const previewImage = document.getElementById('previewImage');
        const removePhotoBtn = document.getElementById('removePhoto');

        // Click to upload
        photoUploadArea.addEventListener('click', () => {
            photoInput.click();
        });

        // Drag and drop functionality
        photoUploadArea.addEventListener('dragenter', (e) => {
            e.preventDefault();
            photoUploadArea.classList.add('dragover');
        });

        photoUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (e.dataTransfer) {
                e.dataTransfer.dropEffect = 'copy';
            }
            photoUploadArea.classList.add('dragover');
        });

        photoUploadArea.addEventListener('dragleave', () => {
            photoUploadArea.classList.remove('dragover');
        });

        photoUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            photoUploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // Prevent the browser from opening the file if dropped outside the drop zone
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        // File input change
        photoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Handle file selection
        function handleFileSelect(file) {
            if (file && file.type.startsWith('image/')) {
                if (file.size > 10 * 1024 * 1024) { // 10MB limit
                    alert('File size must be less than 10MB');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    photoUploadArea.style.display = 'none';
                    photoPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                alert('Please select a valid image file');
            }
        }

        // Remove photo
        removePhotoBtn.addEventListener('click', () => {
            photoInput.value = '';
            photoUploadArea.style.display = 'block';
            photoPreview.style.display = 'none';
            previewImage.src = '';
        });

        // Star rating functionality
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating');
        const ratingText = document.getElementById('ratingText');
        let currentRating = 0;

        const ratingMessages = {
            0: 'Click to rate',
            1: 'Poor',
            2: 'Fair', 
            3: 'Good',
            4: 'Very Good',
            5: 'Excellent'
        };

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                currentRating = index + 1;
                updateStarDisplay();
                updateRatingText();
            });

            star.addEventListener('mouseenter', () => {
                highlightStars(index + 1);
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', () => {
            updateStarDisplay();
        });

        function highlightStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.style.color = '#ffd700';
                } else {
                    star.style.color = '#e0e0e0';
                }
            });
        }

        function updateStarDisplay() {
            stars.forEach((star, index) => {
                if (index < currentRating) {
                    star.classList.add('active');
                    star.style.color = '#ffd700';
                } else {
                    star.classList.remove('active');
                    star.style.color = '#e0e0e0';
                }
            });
        }

        function updateRatingText() {
            ratingInput.value = currentRating;
            ratingText.textContent = ratingMessages[currentRating];
        }

        // Form submission
        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const name = formData.get('name');
            const description = formData.get('description');
            const photo = formData.get('photo');
            const rating = formData.get('rating');
            // include additional fields (optional; backend may ignore)
            formData.set('email', (document.getElementById('email')?.value || '').trim());
            
            
            

            // Basic validation
            if (!name || !description) {
                alert('Please fill in all required fields (Name, Description)');
                return;
            }

            // Show loading state with spinner
            const submitBtn = this.querySelector('.submit-btn');
            const originalHTML = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Sending...';
            submitBtn.disabled = true;

            try {
                // Submit to API
                const response = await fetch('http://localhost:5000/api/feedback', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Reset form
                    this.reset();
                    photoUploadArea.style.display = 'block';
                    photoPreview.style.display = 'none';
                    previewImage.src = '';
                    // Reset rating
                    currentRating = 0;
                    updateStarDisplay();
                    updateRatingText();
                    // Show success modal
                    const modal = document.getElementById('successModal');
                    modal.style.display = 'flex';
                } else {
                    throw new Error(result.error || 'Failed to send message');
                }
            } catch (error) {
                console.error('Error submitting message:', error);
                alert('Sorry, there was an error sending your message. Please try again or contact us directly.');
            } finally {
                // Reset button state
                submitBtn.innerHTML = originalHTML;
                submitBtn.disabled = false;
            }
        });

        // Toast helper
        function showToast(message) {
            let el = document.querySelector('.toast');
            if (!el) {
                el = document.createElement('div');
                el.className = 'toast';
                document.body.appendChild(el);
            }
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        // Success modal OK button -> redirect to index
        document.getElementById('successOkBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
