    <script>

        // Load dynamic testimonials from API
        async function loadDynamicTestimonials() {
            const container = document.getElementById('dynamicTestimonials');
            
            try {
                const response = await fetch('http://localhost:5000/api/testimonials');
                const data = await response.json();
                
                if (data.success && data.testimonials.length > 0) {
                    try { localStorage.setItem('cache:testimonials', JSON.stringify(data)); } catch (_) {}
                    // Prefetch and cache photos as data URLs for offline use
                    try {
                        await Promise.all(
                            data.testimonials
                                .filter(t => t.photo_path)
                                .map(async (t) => {
                                    const url = `http://localhost:5000${t.photo_path}`;
                                    try {
                                        const resp = await fetch(url, { mode: 'cors' });
                                        if (!resp.ok) return;
                                        const blob = await resp.blob();
                                        const reader = new FileReader();
                                        const dataUrl = await new Promise((resolve, reject) => {
                                            reader.onloadend = () => resolve(reader.result);
                                            reader.onerror = reject;
                                            reader.readAsDataURL(blob);
                                        });
                                        try { localStorage.setItem(`cache:image:${t.photo_path}`, String(dataUrl)); } catch (_) {}
                                    } catch (_) { /* ignore single image failures */ }
                                })
                        );
                    } catch (_) {}
                    // Create carousel with side previews
                    window.testimonials = data.testimonials;
                    window.currentIndex = 0;
                    
                    function renderCarousel() {
                        const current = window.testimonials[window.currentIndex];
                        const leftPreviews = [];
                        const rightPreviews = [];
                        
                        // Create left side previews
                        for (let i = 1; i <= 2; i++) {
                            const index = (window.currentIndex - i + window.testimonials.length) % window.testimonials.length;
                            const testimonial = window.testimonials[index];
                            leftPreviews.push(`
                                <div class="side-preview ${i === 2 ? 'far' : ''}" onclick="setCurrentIndex(${index})">
                                    ${testimonial.photo_path ? 
                                        `<img src="http://localhost:5000${testimonial.photo_path}" alt="${testimonial.name}">` :
                                        `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #ec4899, #db2777); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">${testimonial.name.charAt(0).toUpperCase()}</div>`
                                    }
                                </div>
                            `);
                        }
                        
                        // Create right side previews
                        for (let i = 1; i <= 2; i++) {
                            const index = (window.currentIndex + i) % window.testimonials.length;
                            const testimonial = window.testimonials[index];
                            rightPreviews.push(`
                                <div class="side-preview ${i === 2 ? 'far' : ''}" onclick="setCurrentIndex(${index})">
                                    ${testimonial.photo_path ? 
                                        `<img src="http://localhost:5000${testimonial.photo_path}" alt="${testimonial.name}">` :
                                        `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #ec4899, #db2777); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">${testimonial.name.charAt(0).toUpperCase()}</div>`
                                    }
                                </div>
                            `);
                        }
                        
                        container.innerHTML = `
                            ${leftPreviews.reverse().join('')}
                            <div class="dynamic-testimonial-card">
                                <div class="dynamic-card-header">
                                    <div class="dynamic-card-image">
                                        ${current.photo_path ? 
                                            `<img src="http://localhost:5000${current.photo_path}" alt="${current.name}">` :
                                            `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #ec4899, #db2777); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 28px;">${current.name.charAt(0).toUpperCase()}</div>`
                                        }
                                    </div>
                                    <div class="dynamic-card-info">
                                        <h3>${current.name}</h3>
                                    </div>
                                </div>
                                <p class="dynamic-testimonial-text">${current.message}</p>
                                <div class="testimonial-star-rating">
                                    ${(() => {
                                        const r = Math.max(0, Math.min(5, Number(current.rating || 0)));
                                        const filled = Array.from({length: r}).map(() => '<span class="testimonial-star">★</span>').join('');
                                        const empty = Array.from({length: 5 - r}).map(() => '<span class="testimonial-star" style="opacity:0.25;">★</span>').join('');
                                        return filled + empty;
                                    })()}
                                </div>
                            </div>
                            ${rightPreviews.join('')}
                        `;
                    }
                    
                    // Make setCurrentIndex globally available
                    window.setCurrentIndex = function(index) {
                        window.currentIndex = index;
                        renderCarousel();
                    };
                    
                    renderCarousel();
                } else {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No testimonials available yet.</div>';
                }
            } catch (error) {
                console.error('Error loading testimonials:', error);
                // Fallback to cached content if available
                try {
                    const cached = localStorage.getItem('cache:testimonials');
                    if (cached) {
                        const data = JSON.parse(cached);
                        if (data && Array.isArray(data.testimonials) && data.testimonials.length > 0) {
                            container.innerHTML = data.testimonials.map(testimonial => `
                        <div class="dynamic-testimonial-card">
                            <div class="dynamic-card-header">
                                <div class="dynamic-card-image">
                                    ${testimonial.photo_path ? 
                                        (() => { const cachedImg = localStorage.getItem(`cache:image:${testimonial.photo_path}`); return cachedImg ? `<img src="${cachedImg}" alt="${testimonial.name}">` : `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #d4af37, #b89728); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px;">${testimonial.name.charAt(0).toUpperCase()}</div>`; })() :
                                        `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #d4af37, #b89728); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px;">${testimonial.name.charAt(0).toUpperCase()}</div>`
                                    }
                                </div>
                                <div class="dynamic-card-info">
                                    <h3>${testimonial.name}</h3>
                                    
                                    <div class="dynamic-wedding-details">
                                        <span class="dynamic-wedding-type">Wedding Message</span>
                                        <span class="dynamic-wedding-date">${new Date(testimonial.created_at).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                            <p class="dynamic-testimonial-text">"${testimonial.message}"</p>
                            <div class="testimonial-star-rating">
                                ${(() => {
                                    const r = Math.max(0, Math.min(5, Number(testimonial.rating || 0)));
                                    const filled = Array.from({length: r}).map(() => '<span class="testimonial-star">★</span>').join('');
                                    const empty = Array.from({length: 5 - r}).map(() => '<span class="testimonial-star" style="opacity:0.25;">★</span>').join('');
                                    return filled + empty;
                                })()}
                            </div>
                        </div>
                    `).join('');
                            return;
                        }
                    }
                } catch (_) {}
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">Offline. Showing no testimonials. Try again later.</div>';
            }
        }

        // Add smooth scroll animation to testimonials
        document.addEventListener('DOMContentLoaded', function() {
            // Load dynamic testimonials
            loadDynamicTestimonials();
            
            const testimonials = document.querySelectorAll('.dynamic-testimonial-card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            });


            // Set up observer for dynamic testimonials after they're loaded
            setTimeout(() => {
                document.querySelectorAll('.dynamic-testimonial-card').forEach(testimonial => {
                    testimonial.style.opacity = '0';
                    testimonial.style.transform = 'translateY(30px)';
                    testimonial.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    observer.observe(testimonial);
                });

                // Carousel controls
                const container = document.getElementById('dynamicTestimonials');
                const prevBtn = document.querySelector('.carousel-nav.prev');
                const nextBtn = document.querySelector('.carousel-nav.next');

                function navigateCarousel(direction) {
                    if (window.testimonials && window.testimonials.length > 0) {
                        if (direction === -1) {
                            window.currentIndex = (window.currentIndex - 1 + window.testimonials.length) % window.testimonials.length;
                        } else {
                            window.currentIndex = (window.currentIndex + 1) % window.testimonials.length;
                        }
                        window.setCurrentIndex(window.currentIndex);
                    }
                }

                if (prevBtn) prevBtn.addEventListener('click', () => navigateCarousel(-1));
                if (nextBtn) nextBtn.addEventListener('click', () => navigateCarousel(1));
            }, 150);
        });
    </script>
    <script>
        (function(){
            try {
                function api(url){ return (location && location.protocol === 'file:' ? 'http://localhost:5000' : '') + url; }
                function resolveUrl(u){
                    if (!u) return '';
                    const s = String(u).trim();
                    if (!s) return '';
                    if (s.startsWith('/uploads/')) return api(s);
                    if (/^https?:\/\//i.test(s) || /^data:/i.test(s) || /^file:\/\//i.test(s)) return s;
                    return s; // relative path
                }

                function apply(){
                    const raw = localStorage.getItem('pageOverrides:testimonials');
                    const data = raw ? JSON.parse(raw) : null;
                    if (!data) return;
                    const hero = document.querySelector('.dynamic-testimonials');
                    if (hero && data.bg) {
                        const url = resolveUrl(data.bg);
                        hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('${url}')`;
                    }
                    if (data.text1) {
                        const el = document.querySelector('.dynamic-testimonials .section-title');
                        if (el) el.textContent = data.text1;
                    }
                    if (data.text2) {
                        const el = document.querySelector('.dynamic-testimonials .section-subtitle');
                        if (el) el.textContent = data.text2;
                    }
                }
                apply();
                window.addEventListener('storage', function(e){ if (e && e.key === 'pageOverrides:testimonials') apply(); });
            } catch (_) {}
        })();
    </script>
    <script>
        (function(){
            try {
                function api(url){ return (location && location.protocol === 'file:' ? 'http://localhost:5000' : '') + url; }
                function resolveLogoUrl(u){
                    if (!u) return '';
                    const s = String(u).trim();
                    if (!s) return '';
                    if (s.startsWith('/uploads/')) return api(s);
                    if (/^https?:\/\//i.test(s) || /^data:/i.test(s) || /^file:\/\//i.test(s)) return s;
                    return s;
                }
                let applyTimer = null;
                function preloadImage(url) {
                    return new Promise((resolve, reject) => {
                        if (!url || url.startsWith('data:')) {
                            resolve(url);
                            return;
                        }
                        const img = new Image();
                        img.onload = () => resolve(url);
                        img.onerror = () => resolve(url); // Still apply even if load fails
                        img.src = url;
                    });
                }
                async function applyHexLogo(){
                    let backend = null;
                    let local = null;
                    try {
                        const r = await fetch(api('/api/page-overrides/global'));
                        if (r.ok) {
                            const j = await r.json();
                            backend = (j && j.data) || null;
                        }
                    } catch (_) {}
                    try {
                        const raw = localStorage.getItem('pageOverrides:global');
                        if (raw) local = JSON.parse(raw);
                    } catch (_) {}
                    const data = Object.assign({}, backend || {}, local || {});
                    const text = (data && data.hexLogoText) || '';
                    const bg = (data && data.hexLogoBg) || '';
                    if (!text && !bg) return;
                    const els = document.querySelectorAll('.hex-logo');
                    
                    // Preload image if exists
                    let logoUrl = '';
                    if (bg) {
                        logoUrl = resolveLogoUrl(bg);
                        if (logoUrl && !logoUrl.startsWith('data:')) {
                            await preloadImage(logoUrl);
                        }
                    }
                    
                    // Apply changes after image is preloaded
                    els.forEach(el => {
                        if (text) el.textContent = text;
                        if (bg && logoUrl) {
                            el.style.backgroundImage = `url('${logoUrl}')`;
                            el.style.backgroundSize = 'cover';
                            el.style.backgroundPosition = 'center';
                            el.style.backgroundColor = 'transparent';
                        }
                    });
                }
                applyHexLogo();
                try { window.applyHexLogo = applyHexLogo; } catch(_) {}
                window.addEventListener('storage', (e) => {
                    if (!e) return;
                    if (e.key === 'pageOverrides:global') {
                        if (applyTimer) clearTimeout(applyTimer);
                        applyTimer = setTimeout(applyHexLogo, 200);
                    }
                });
            } catch (_) {}
        })();
    </script>
