<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }


        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 32px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        .title {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background-color: #ffffff;
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .form-input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .form-input:hover:not(:focus) {
            border-color: #d1d5db;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .confirm-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .confirm-btn:hover::before {
            left: 100%;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        .confirm-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc2626;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 1px solid #fecaca;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(220, 38, 38, 0.1);
        }

        .success-message {
            color: #059669;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid #bbf7d0;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(5, 150, 105, 0.1);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading .confirm-btn {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
        }


        .password-match {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .password-match.match {
            color: #059669;
        }

        .password-match.no-match {
            color: #dc2626;
        }

        .password-match::before {
            content: '';
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }

        .password-match.match::before {
            background: #059669;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='m13.854 3.646-7.5 7.5a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6 10.293l7.146-7.147a.5.5 0 0 1 .708.708z'/%3e%3c/svg%3e");
            background-size: 10px;
            background-position: center;
            background-repeat: no-repeat;
        }

        .password-match.no-match::before {
            background: #dc2626;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
            background-size: 10px;
            background-position: center;
            background-repeat: no-repeat;
        }

        .btn-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .form-input.valid {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .form-input.invalid {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .form-input {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            color: #9ca3af;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #6b7280;
            background-color: rgba(0, 0, 0, 0.05);
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(0.95);
        }

        .password-toggle svg {
            transition: all 0.2s ease;
        }

        .password-toggle:hover svg {
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
                margin: 16px;
                border-radius: 20px;
            }
            
            .title {
                font-size: 22px;
            }
            
            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your current password and choose a new secure password</p>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <form id="reset-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="current-password" class="form-input" placeholder="Enter Current Password" required>
                    <button type="button" class="password-toggle" id="current-password-toggle">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="new-password" class="form-input" placeholder="New Password" required>
                    <button type="button" class="password-toggle" id="new-password-toggle">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" class="form-input" placeholder="Confirm New Password" required>
                    <button type="button" class="password-toggle" id="confirm-password-toggle">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div id="password-match" class="password-match" style="display: none;"></div>
            </div>
            
            <button type="submit" class="confirm-btn" id="submit-btn">
                <span class="btn-text">Update Password</span>
                <span class="btn-loading" style="display: none;">
                    <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
                            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                    Updating...
                </span>
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('reset-form');
            const currentPasswordInput = document.getElementById('current-password');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const submitBtn = document.getElementById('submit-btn');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const passwordMatch = document.getElementById('password-match');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoading = submitBtn.querySelector('.btn-loading');
            const currentPasswordToggle = document.getElementById('current-password-toggle');
            const currentEyeIcon = currentPasswordToggle ? currentPasswordToggle.querySelector('.eye-icon') : null;
            const currentEyeOffIcon = currentPasswordToggle ? currentPasswordToggle.querySelector('.eye-off-icon') : null;
            const newPasswordToggle = document.getElementById('new-password-toggle');
            const eyeIcon = newPasswordToggle.querySelector('.eye-icon');
            const eyeOffIcon = newPasswordToggle.querySelector('.eye-off-icon');
            const confirmPasswordToggle = document.getElementById('confirm-password-toggle');
            const confirmEyeIcon = confirmPasswordToggle.querySelector('.eye-icon');
            const confirmEyeOffIcon = confirmPasswordToggle.querySelector('.eye-off-icon');

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }

            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }

            function hideMessages() {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
            }

            function setLoading(loading) {
                if (loading) {
                    form.classList.add('loading');
                    btnText.style.display = 'none';
                    btnLoading.style.display = 'flex';
                    submitBtn.disabled = true;
                } else {
                    form.classList.remove('loading');
                    btnText.style.display = 'block';
                    btnLoading.style.display = 'none';
                    submitBtn.disabled = false;
                }
            }


            function checkPasswordMatch() {
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (confirmPassword.length === 0) {
                    passwordMatch.style.display = 'none';
                    return;
                }

                passwordMatch.style.display = 'flex';
                passwordMatch.className = 'password-match';

                if (newPassword === confirmPassword) {
                    passwordMatch.textContent = 'Passwords match';
                    passwordMatch.classList.add('match');
                    confirmPasswordInput.classList.remove('invalid');
                    confirmPasswordInput.classList.add('valid');
                } else {
                    passwordMatch.textContent = 'Passwords do not match';
                    passwordMatch.classList.add('no-match');
                    confirmPasswordInput.classList.remove('valid');
                    confirmPasswordInput.classList.add('invalid');
                }
            }

            // Password match checking
            newPasswordInput.addEventListener('input', function() {
                checkPasswordMatch();
            });

            // Password match checking
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);

            // Password visibility toggle for current password
            if (currentPasswordToggle && currentEyeIcon && currentEyeOffIcon) {
                currentPasswordToggle.addEventListener('click', function() {
                    const isPassword = currentPasswordInput.type === 'password';
                    console.log('Current password toggle clicked, isPassword:', isPassword);
                    
                    if (isPassword) {
                        currentPasswordInput.type = 'text';
                        currentEyeIcon.style.display = 'none';
                        currentEyeOffIcon.style.display = 'block';
                        console.log('Password shown');
                    } else {
                        currentPasswordInput.type = 'password';
                        currentEyeIcon.style.display = 'block';
                        currentEyeOffIcon.style.display = 'none';
                        console.log('Password hidden');
                    }
                });
            } else {
                console.log('Current password toggle elements not found');
            }

            // Password visibility toggle for new password
            newPasswordToggle.addEventListener('click', function() {
                const isPassword = newPasswordInput.type === 'password';
                
                if (isPassword) {
                    newPasswordInput.type = 'text';
                    eyeIcon.style.display = 'none';
                    eyeOffIcon.style.display = 'block';
                } else {
                    newPasswordInput.type = 'password';
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                }
            });

            // Password visibility toggle for confirm password
            confirmPasswordToggle.addEventListener('click', function() {
                const isPassword = confirmPasswordInput.type === 'password';
                
                if (isPassword) {
                    confirmPasswordInput.type = 'text';
                    confirmEyeIcon.style.display = 'none';
                    confirmEyeOffIcon.style.display = 'block';
                } else {
                    confirmPasswordInput.type = 'password';
                    confirmEyeIcon.style.display = 'block';
                    confirmEyeOffIcon.style.display = 'none';
                }
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessages();

                const currentPassword = currentPasswordInput.value.trim();
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();

                // Client-side validation
                if (!currentPassword || !newPassword || !confirmPassword) {
                    showError('All fields are required');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showError('New password and confirm password do not match');
                    return;
                }

                // Basic password validation
                if (newPassword.length < 6) {
                    showError('Password must be at least 6 characters long');
                    return;
                }

                if (currentPassword === newPassword) {
                    showError('New password must be different from current password');
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch('http://localhost:3301/api/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            currentPassword: currentPassword,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccess(data.message || 'Password updated successfully!');
                        form.reset();
                        passwordMatch.style.display = 'none';
                        // Remove validation classes
                        [currentPasswordInput, newPasswordInput, confirmPasswordInput].forEach(input => {
                            input.classList.remove('valid', 'invalid');
                        });
                    } else {
                        showError(data.error || 'Failed to update password');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showError('Network error. Please check if the server is running.');
                } finally {
                    setLoading(false);
                }
            });

            // Clear messages when user starts typing
            [currentPasswordInput, newPasswordInput, confirmPasswordInput].forEach(input => {
                input.addEventListener('input', hideMessages);
            });
        });
    </script>
</body>
</html>
